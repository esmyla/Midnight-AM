name: Midnight
options:
  bundleIdPrefix: com.esmyla
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(MIDNIGHT_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Midnight:
    type: application
    platform: iOS
    sources:
      - Midnight
    info:
      path: Midnight/Info.plist
      properties:
        CFBundleDisplayName: Midnight
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Midnight uses the camera so you can photograph proof that you finished your commitment.
        NSPhotoLibraryUsageDescription: Midnight reads a screenshot or photo you choose as proof that you finished your commitment.
        OPENAI_API_KEY: $(OPENAI_API_KEY)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.esmyla.midnight
            CFBundleURLSchemes: [midnight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esmyla.midnight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
